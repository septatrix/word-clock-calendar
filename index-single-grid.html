<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
        :root {
            background-color: black;
            color: white;
        }

        body {
            margin: 0;
            height: 100vh;
            display: grid;
            place-content: center;
        }

        #calendar {
            display: grid;
            grid-template-columns: repeat(calc(12*13), auto);
            /* gap: .2em; */
            width: 40em;
            height: 20em;
            font-family: monospace;
            font-size: 3em;
            font-weight: bold;
            place-items: center;
            justify-content: space-between;
        }

        #calendar>.day {
            grid-column: span 12;
        }

        #calendar>.month {
            grid-column: span 13;
        }

        .day-row {
            display: grid;
            grid-column: 1 / -1;
            grid-template-columns: subgrid;
            place-items: center;
        }

        .month-wrapper {
            grid-column: 1 / -1;
        }

        .month-row {
            display: grid;
            grid-template-columns: repeat(12, auto);
            align-items: center;
            justify-content: space-between;
        }
    </style>
</head>
